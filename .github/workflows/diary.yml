name: 毎日Plaud日記生成

on:
  schedule:
    # 毎日 21:00 JST = 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch:
    # GitHub画面から手動実行も可能

jobs:
  generate-diary:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.12 セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 日記を生成してGoogle Docsに保存
        env:
          PLAUD_TOKEN: ${{ secrets.PLAUD_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python plaud_diary.py
